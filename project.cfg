# Fichier de configuration lu par l'outil en ligne de commande fxsdk.
#
# Note : le fxSDK n'utilise pas de fichier addin.json. Les metadonnees de
# l'add-in sont partagees entre ce fichier et l'appel generate_g3a() du
# CMakeLists.txt, qui est celui qui fixe reellement le nom affiche et les
# icones au moment de la fabrication du .g3a.
#
# Si ton fxSDK est plus recent que ce modele, genere un projet neuf avec
# `fxsdk new RMNChem` et remplace le contenu de src/ et assets-cg/ : le
# project.cfg produit sera forcement au bon format pour ta version.

# Nom affiche dans le menu principal (16 caracteres au plus sur fx-CG)
NAME = RMNChem

# Nom interne : @ suivi d'au plus 7 majuscules ou chiffres.
# Certaines versions d'OS refusent de lancer un add-in selon ce nom.
# En cas d'ecran noir au lancement, voir la section Depannage du README.
INTERNAL = @RMNCHEM

# Version, format MM.mm.pppp
VERSION = 01.00.0000

# Icones du menu principal : 92 x 64 pixels, deux etats
ICON_CG_UNS = assets-cg/icon-uns.png
ICON_CG_SEL = assets-cg/icon-sel.png
