name: Build G3A

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: docker.io/lephenixnoir/fxsdk:latest
      options: --user root
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Compile G3A
        run: fxsdk build-cg

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: RMNChem-g3a
          path: |
            *.g3a
            build*/*.g3a
