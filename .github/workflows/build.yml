name: Build G3A
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git cmake python3 python3-pip libpng-dev libusb-1.0-0-dev gcc-sh-elf || true
          pip3 install giteapc --break-system-packages || pip3 install giteapc
          giteapc install -y Lephenixnoir/fxsdk Lephenixnoir/gint

      - name: Build Casio G3A
        run: |
          fxsdk build-cg

      - name: Upload G3A
        uses: actions/upload-artifact@v4
        with:
          name: RMNChem-g3a
          path: |
            *.g3a
            build*/*.g3a
```[cite: 1]

4. En haut à droite, clique sur **Commit changes...**
