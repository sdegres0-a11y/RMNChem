name: Build G3A
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/lephenixnoir/fxsdk:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Casio G3A
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          fxsdk build-cg

      - name: Upload G3A
        uses: actions/upload-artifact@v4
        with:
          name: RMNChem-g3a
          path: |
            *.g3a
            build*/*.g3a
```[cite: 1]

5. Clique sur le bouton vert **Commit changes...** puis confirme avec **Commit changes**.

